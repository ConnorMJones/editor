[package]
name = "editor"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "edt"
path = "src/main.rs"

[lints]
workspace = true

[features]
tracy = ["dep:tracing-tracy", "dep:tracy-client"]
# Reports every allocation too; heavier captures.
tracy-alloc = ["tracy"]
# Context switches and call-stack sampling of every thread; large captures.
tracy-sampling = [
    "tracy",
    "tracy-client/system-tracing",
    "tracy-client/context-switch-tracing",
    "tracy-client/sampling",
]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
cli.workspace = true
clap.workspace = true
gpui.workspace = true
helix-core.workspace = true
gpui_platform = { workspace = true, features = ["wayland", "x11"] }
model.workspace = true
slotmap.workspace = true
state = { workspace = true, features = ["typeset"] }
typeset.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-tracy = { workspace = true, optional = true }
tracy-client = { workspace = true, optional = true }
