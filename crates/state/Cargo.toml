[package]
name = "state"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[features]
# Runs typeset requests in-process, for hosts and headless tests.
typeset = ["dep:typeset"]
integration = ["typeset"]

[dependencies]
git2.workspace = true
helix-core.workspace = true
helix-stdx.workspace = true
image.workspace = true
ignore.workspace = true
imara-diff.workspace = true
export.workspace = true
ink.workspace = true
library.workspace = true
reader.workspace = true
model.workspace = true
serde.workspace = true
notify.workspace = true
nucleo.workspace = true
pulldown-cmark.workspace = true
ropey.workspace = true
slotmap.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
usvg.workspace = true
typeset = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
grammars.workspace = true

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["integration"]

[[bench]]
name = "keystroke"
harness = false

[[bench]]
name = "display"
harness = false

[[bench]]
name = "files"
harness = false

[[bench]]
name = "diff"
harness = false

[[bench]]
name = "diffview"
harness = false

[[bench]]
name = "markdown"
harness = false

[[bench]]
name = "backlinks"
harness = false

[[bench]]
name = "figures"
harness = false
required-features = ["typeset"]
