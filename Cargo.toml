[workspace]
members = ["crates/*", "vendor/*", "vendor/refineable/derive_refineable"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
# Internal crates.
model = { path = "crates/model" }
state = { path = "crates/state" }
cli = { path = "crates/cli" }

# Vendored from zed (GPUI and its internal dependencies).
bench_metrics = { path = "vendor/bench_metrics" }
collections = { path = "vendor/collections" }
derive_refineable = { path = "vendor/refineable/derive_refineable" }
gpui = { path = "vendor/gpui", default-features = false }
gpui_linux = { path = "vendor/gpui_linux", default-features = false }
gpui_macros = { path = "vendor/gpui_macros" }
gpui_platform = { path = "vendor/gpui_platform" }
gpui_shared_string = { path = "vendor/gpui_shared_string" }
gpui_util = { path = "vendor/gpui_util" }
gpui_wgpu = { path = "vendor/gpui_wgpu" }
http_client = { path = "vendor/http_client" }
path = { path = "vendor/path" }
perf = { path = "vendor/perf", default-features = false }
refineable = { path = "vendor/refineable" }
scheduler = { path = "vendor/scheduler" }
sum_tree = { path = "vendor/sum_tree" }
util = { path = "vendor/util" }
util_macros = { path = "vendor/util_macros" }
zlog = { path = "vendor/zlog" }
ztracing = { path = "vendor/ztracing" }
ztracing_macro = { path = "vendor/ztracing_macro" }

# External.
clap = { version = "4.6.7", features = ["derive"] }
toml = "1.1.6"
# Pinned to the Tracy 0.13.1 protocol (the system profiler); bump with the viewer.
tracing-tracy = "0.11.4"
tracy-client = "=0.18.4"
ignore = "0.4.33"
notify = { version = "8.2.0", default-features = false }
git2 = { version = "0.21.0", default-features = false }
# Same version helix-core uses, so the tree keeps one copy.
imara-diff = "0.2.0"

# Vendored from helix.
helix-core = { path = "vendor/helix-core" }
helix-loader = { path = "vendor/helix-loader" }
helix-stdx = { path = "vendor/helix-stdx" }
ropey = { version = "1.6.1", default-features = false, features = ["simd"] }
tree-house = { version = "0.4", default-features = false }
nucleo = "0.5.0"
foldhash = "0.2"
etcetera = "0.11"
quickcheck = { version = "1", default-features = false }
accesskit = { version = "0.24.0", features = ["enumn"] }
accesskit_unix = "0.22"
anyhow = "1.0.86"
ashpd = { version = "0.13", default-features = false, features = ["async-io", "inhibit", "open_uri", "file_chooser", "settings"] }
async-channel = { version = "2.5", default-features = false }
async-compression = { version = "0.4", features = ["bzip2", "gzip", "futures-io"] }
async-fs = "2.1"
async-tar = { git = "https://github.com/zed-industries/async-tar", rev = "bd3ad6f89df9a9da7a8535958756d6bf465936a0" }
async-task = "4.7"
async_zip = { version = "0.0.18", features = ["deflate", "deflate64"] }
backtrace = "0.3"
bitflags = "2.6.0"
bytemuck = "1"
bytes = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
core-video = { version = "0.5", default-features = false, features = ["link"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
ctor = "1.0.12"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from_str"] }
dirs = "6.0"
dunce = "1.0"
env_logger = "0.11"
etagere = "0.2"
flume = { version = "0.12", default-features = false, features = ["async"] }
font-kit = { git = "https://github.com/zed-industries/font-kit", rev = "94b0f28166665e8fd2f53ff6d268a14955c82269", package = "zed-font-kit", version = "0.14.1-zed", default-features = false }
futures = "0.3.34"
futures-concurrency = "7.7.1"
futures-lite = "2"
globset = "0.4"
hdrhistogram = { version = "7", default-features = false }
heapless = "0.9.2"
heck = "0.5"
http = "1.1"
http-body = "1.0"
image = { version = "0.25.1", default-features = false, features = ["bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "rayon", "tga", "tiff", "webp"] }
indexmap = { version = "2.7.0", features = ["serde"] }
inventory = "0.3.19"
itertools = "0.14.0"
js-sys = "0.3"
libc = "0.2"
log = { version = "0.4", default-features = false, features = ["std"] }
mach2 = "0.6"
nix = "0.30"
notify-rust = "4"
objc2 = "0.6"
objc2-core-foundation = { version = "=0.3.2", default-features = false }
objc2-core-video = { version = "=0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer"] }
oo7 = { version = "0.6", default-features = false }
parking_lot = "0.12.1"
percent-encoding = "2.3.2"
perf-event = { package = "perf-event2", version = "0.7.4" }
pollster = "0.4.0"
postage = { version = "0.5", default-features = false }
pretty_assertions = { version = "1.3.0", features = ["unstable"] }
proc-macro2 = "1.0.93"
profiling = "1"
proptest = { git = "https://github.com/proptest-rs/proptest", rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b", features = ["attr-macro"] }
quote = "1.0.9"
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
raw-window-handle = "0.6"
rayon = "1.8"
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }
rust-embed = { version = "8.11", features = ["include-exclude", "compression"] }
rustc-hash = "2.1.0"
scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", default-features = false, package = "zed-scap", version = "0.0.8-zed" }
schemars = { version = "1.0", default-features = false, features = ["std", "indexmap2"] }
serde = { version = "1.0.229", features = ["rc", "derive"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
serde_json_lenient = { version = "0.2", features = ["preserve_order", "raw_value"] }
serde_urlencoded = "0.7"
sha2 = "0.10"
shlex = "2.0"
slotmap = "1.0.6"
smallvec = { version = "1.6", features = ["union", "const_new"] }
smol = "2.0"
spin = { version = "0.10", default-features = false, features = ["mutex", "spin_mutex", "lock_api"] }
stacksafe = "1.0"
strum = { version = "0.28", features = ["derive"] }
swash = "0.2.6"
syn = { version = "2.0", default-features = false, features = ["proc-macro"] }
taffy = { version = "=0.13.0", default-features = false }
tempfile = "3.20.0"
tendril = "0.5"
thiserror = "2.0.12"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicase = "2.6"
unicode-bidi = { version = "0.3.18", default-features = false, features = ["hardcoded-data"] }
unicode-segmentation = "1.10"
url = "2.2"
usvg = { version = "0.46.0", default-features = false }
uuid = { version = "1.1", features = ["serde"] }
walkdir = "2.5"
wasm-bindgen = "0.2.120"
wasm_thread = { git = "https://github.com/zed-industries/wasm_thread", rev = "0cf96c7708dfb97ccf3da50347e25edcf75d6937", version = "0.3", features = ["es_modules"] }
web-sys = "0.3"
web-time = "1.1.0"
wgpu = { version = "29.0", default-features = false }
which = "8"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }
xkbcommon = { version = "0.8", default-features = false }
tracing = "0.1.44"

[patch.crates-io]
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.build-override]
codegen-units = 16
split-debuginfo = "unpacked"
debug = "limited"

[profile.dev.package]
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
util_macros = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
serde_json = { opt-level = 3 }

[profile.release]
debug = "limited"
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unexpected_cfgs = { level = "allow" }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
declare_interior_mutable_const = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
let_underscore_future = "allow"
single_range_in_vec_init = "allow"
too_many_arguments = "allow"
large_enum_variant = "allow"
nonminimal_bool = "allow"

